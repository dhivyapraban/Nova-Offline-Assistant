name: nova_assistant
description: "Nova Assistant - AI-powered offline voice assistant for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.3.1

  # Audio
  just_audio: ^0.9.42
  # record: ^5.2.1  # TODO: Re-add when implementing Whisper.cpp audio recording
  speech_to_text: ^6.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Files
  file_picker: ^8.1.6
  open_filex: ^4.5.0

  # PDF
  syncfusion_flutter_pdfviewer: ^31.1.21
  syncfusion_flutter_pdf: ^31.2.18

  # Device Info
  device_info_plus: ^11.2.1
  package_info_plus: ^8.2.1

  # Timezone for scheduled notifications
  timezone: ^0.10.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/sounds/
